[project]
name = "geochem"
version = "0.1.0"
description = "GeoChem Data Curation Agent - Schema-driven geochemical literature data extraction and standardization"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-docx>=0.8.11",
    "pdfplumber>=0.10",
    "PyMuPDF>=1.23",
    "docling>=2.107,<3",
    "beautifulsoup4>=4.12",
    "pandas[html]>=2.0",
    "requests>=2.31",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "openai>=1.0",
    "anthropic>=0.20",
    "google-genai>=2.0",
    "zhipuai>=2.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "keyring>=25.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain>=1.0,<2.0",
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "langgraph-checkpoint-postgres>=2.0",
    "PyJWT[crypto]>=2.8",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
vector = [
    "FlagEmbedding>=1.3,<2",
    "qdrant-client>=1.12,<2",
]

[project.scripts]
geochem = "geochem.cli:app"
geochem-ui = "geochem.web.server:main"
geochem-web = "geochem.web.server:main"
geochem-preview = "geochem.web.server:main"
geochem-worker = "geochem.background_tasks:worker_main"
geochem-migrate-postgres = "geochem.core.postgres_migration:main"
geochem-checkpoint-setup = "geochem.core.checkpoint_setup:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geochem = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "-q"
