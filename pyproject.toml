[project]
name = "geochem"
version = "0.1.0"
description = "GeoChem Data Curation Agent - Schema-driven geochemical literature data extraction and standardization"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-docx>=0.8.11",
    "pdfplumber>=0.10",
    "PyMuPDF>=1.23",
    "beautifulsoup4>=4.12",
    "pandas[html]>=2.0",
    "requests>=2.31",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "openai>=1.0",
    "anthropic>=0.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
    "pytest-cov>=4.0",
]

[project.scripts]
geochem = "geochem.cli:app"
geochem-ui = "geochem.web.server:main"
geochem-web = "geochem.web.server:main"
geochem-legacy-ui = "geochem.ui.app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
