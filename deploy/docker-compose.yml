name: geochem

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${GEOCHEM_LOG_MAX_SIZE:-20m}
    max-file: "${GEOCHEM_LOG_MAX_FILES:-5}"

x-geochem-environment: &geochem-environment
  GEOCHEM_PROFILE: production
  GEOCHEM_HOST: 0.0.0.0
  GEOCHEM_PORT: 8765
  GEOCHEM_OPEN_BROWSER: "false"
  GEOCHEM_LOG_LEVEL: ${GEOCHEM_LOG_LEVEL:-info}
  GEOCHEM_WEB_WORKERS: ${GEOCHEM_WEB_WORKERS:-2}
  GEOCHEM_FORWARDED_ALLOW_IPS: "${GEOCHEM_FORWARDED_ALLOW_IPS:-*}"
  GEOCHEM_ENABLE_API_DOCS: "${GEOCHEM_ENABLE_API_DOCS:-false}"
  GEOCHEM_ALLOWED_HOSTS: ${GEOCHEM_SITE_HOST:-geochem.lan},localhost,127.0.0.1,web
  GEOCHEM_CORS_ORIGINS: https://${GEOCHEM_SITE_HOST:-geochem.lan}
  GEOCHEM_DB_POOL_SIZE: ${GEOCHEM_DB_POOL_SIZE:-5}
  GEOCHEM_DB_MAX_OVERFLOW: ${GEOCHEM_DB_MAX_OVERFLOW:-5}
  GEOCHEM_DB_POOL_TIMEOUT: ${GEOCHEM_DB_POOL_TIMEOUT:-30}
  GEOCHEM_DATABASE_URL: postgresql+psycopg://geochem:${GEOCHEM_DB_PASSWORD}@postgres:5432/geochem
  GEOCHEM_POSTGRES_SCHEMA_MODE: alembic
  GEOCHEM_CHECKPOINT_DATABASE_URL: postgresql+psycopg://geochem:${GEOCHEM_DB_PASSWORD}@postgres:5432/geochem
  GEOCHEM_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  GEOCHEM_CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  GEOCHEM_CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
  GEOCHEM_TASK_BACKEND: celery
  GEOCHEM_WORKER_CONCURRENCY: ${GEOCHEM_WORKER_CONCURRENCY:-2}
  GEOCHEM_TASK_TIME_LIMIT_SECONDS: ${GEOCHEM_TASK_TIME_LIMIT_SECONDS:-7200}
  GEOCHEM_TASK_SOFT_TIME_LIMIT_SECONDS: ${GEOCHEM_TASK_SOFT_TIME_LIMIT_SECONDS:-6900}
  GEOCHEM_TASK_VISIBILITY_TIMEOUT_SECONDS: ${GEOCHEM_TASK_VISIBILITY_TIMEOUT_SECONDS:-7500}
  GEOCHEM_TASK_RESULT_EXPIRES_SECONDS: ${GEOCHEM_TASK_RESULT_EXPIRES_SECONDS:-86400}
  GEOCHEM_AUTH_MODE: oidc
  GEOCHEM_OIDC_ISSUER_URL: https://${GEOCHEM_AUTH_HOST:-auth.geochem.lan}/realms/geochem
  GEOCHEM_OIDC_JWKS_URL: http://keycloak:8080/realms/geochem/protocol/openid-connect/certs
  GEOCHEM_OIDC_CLIENT_ID: geochem-web
  GEOCHEM_OIDC_AUDIENCE: geochem-api
  GEOCHEM_OIDC_SCOPES: openid profile email
  GEOCHEM_CREDENTIAL_MASTER_KEY_FILE: /run/secrets/geochem_credential_master_key
  GEOCHEM_STORAGE_ROOT: /data/workspaces
  GEOCHEM_EXPORT_ROOT: /data/exports
  GEOCHEM_CONFIG: /data/config/settings.local.yaml
  GEOCHEM_WEB_DIST: /app/web/dist
  GEOCHEM_MAX_UPLOAD_MB: ${GEOCHEM_MAX_UPLOAD_MB:-512}
  OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  MIMO_API_KEY: ${MIMO_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

x-geochem-web-environment: &geochem-web-environment
  <<: *geochem-environment
  GEOCHEM_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
  GEOCHEM_KEYCLOAK_REALM: geochem
  GEOCHEM_KEYCLOAK_ADMIN_CLIENT_ID: geochem-admin-api
  GEOCHEM_KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_API_CLIENT_SECRET}

x-geochem-service: &geochem-service
  image: ${GEOCHEM_IMAGE:-geochem:lan}
  build:
    context: ..
    dockerfile: Dockerfile
  environment: *geochem-environment
  volumes:
    - ${GEOCHEM_DATA_PATH:-/srv/geochem/data}:/data
  secrets:
    - geochem_credential_master_key
  logging: *default-logging
  networks:
    - geochem-internal

services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    stop_grace_period: 2m
    logging: *default-logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --data-checksums
      GEOCHEM_DB_PASSWORD: ${GEOCHEM_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_PATH:-/srv/geochem/postgres}:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-geochem-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - geochem-internal

  redis:
    image: redis:8.4.4-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - ${REDIS_DATA_PATH:-/srv/geochem/redis}:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - geochem-internal

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    restart: unless-stopped
    stop_grace_period: 2m
    logging: *default-logging
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://${GEOCHEM_AUTH_HOST:-auth.geochem.lan}
      KC_HOSTNAME_STRICT: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/realm-geochem.json:/opt/keycloak/data/import/realm-geochem.json:ro
      - ./keycloak/themes/geochem:/opt/keycloak/themes/geochem:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - geochem-internal

  migrate:
    <<: *geochem-service
    command:
      - sh
      - -ec
      - alembic -c /app/alembic.ini upgrade head && exec geochem-checkpoint-setup
    restart: "no"
    init: true
    stop_grace_period: 2m
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *geochem-service
    environment: *geochem-web-environment
    restart: unless-stopped
    init: true
    stop_grace_period: 1m
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  worker:
    <<: *geochem-service
    command: ["geochem-worker"]
    restart: unless-stopped
    init: true
    stop_grace_period: 10m
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      GEOCHEM_SITE_HOST: ${GEOCHEM_SITE_HOST:-geochem.lan}
      GEOCHEM_AUTH_HOST: ${GEOCHEM_AUTH_HOST:-auth.geochem.lan}
      GEOCHEM_MAX_UPLOAD_SIZE: ${GEOCHEM_MAX_UPLOAD_MB:-512}MB
    ports:
      - "${GEOCHEM_HTTP_PORT:-80}:80"
      - "${GEOCHEM_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_DATA_PATH:-/srv/geochem/caddy/data}:/data
      - ${CADDY_CONFIG_PATH:-/srv/geochem/caddy/config}:/config
    depends_on:
      web:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - geochem-internal

networks:
  geochem-internal:
    driver: bridge

secrets:
  geochem_credential_master_key:
    file: ./secrets/credential_master_key
